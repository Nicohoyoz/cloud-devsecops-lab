name: Security Scan

on:
  push:
  pull_request:

jobs:
  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true
