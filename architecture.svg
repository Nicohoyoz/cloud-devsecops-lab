<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2b4a">cloud-devsecops-lab — architecture</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#57606a">everything provisioned, configured, scanned, and monitored as code</text>

  <!-- Control / developer machine -->
  <rect x="30" y="95" width="240" height="200" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2b4a">Developer machine (WSL)</text>

  <rect x="50" y="135" width="200" height="34" rx="5" fill="#e7effc" stroke="#2c5aa0"/>
  <text x="150" y="157" text-anchor="middle" font-size="12" fill="#1a2b4a">Terraform  (provisions)</text>

  <rect x="50" y="177" width="200" height="34" rx="5" fill="#efe7fc" stroke="#6b3fa0"/>
  <text x="150" y="199" text-anchor="middle" font-size="12" fill="#3a1f6b">Ansible  (configures)</text>

  <rect x="50" y="219" width="200" height="34" rx="5" fill="#e7fcef" stroke="#1a7a4a"/>
  <text x="150" y="241" text-anchor="middle" font-size="12" fill="#0f4a2b">Checkov  (scans IaC)</text>

  <rect x="50" y="261" width="200" height="24" rx="5" fill="#fff4e5" stroke="#b5760a"/>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#7a4f06">git push  →  GitHub Actions (CI)</text>

  <!-- Arrow to AWS -->
  <line x1="270" y1="180" x2="345" y2="180" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="307" y="172" text-anchor="middle" font-size="10" fill="#57606a">API</text>

  <!-- AWS cloud -->
  <rect x="345" y="95" width="330" height="290" rx="8" fill="#fbfbfc" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2b4a">AWS  (us-east-1)</text>

  <!-- VPC -->
  <rect x="365" y="135" width="290" height="230" rx="6" fill="#f2f6fb" stroke="#2c5aa0" stroke-dasharray="4 3"/>
  <text x="510" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#2c5aa0">VPC 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="455" y="163" width="110" height="26" rx="5" fill="#e7effc" stroke="#2c5aa0"/>
  <text x="510" y="180" text-anchor="middle" font-size="10.5" fill="#1a2b4a">Internet Gateway</text>

  <!-- Subnet -->
  <rect x="390" y="200" width="240" height="150" rx="6" fill="#ffffff" stroke="#8ba7cc"/>
  <text x="510" y="218" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3a5a85">Public subnet 10.0.1.0/24</text>

  <!-- Security group -->
  <rect x="410" y="228" width="200" height="108" rx="5" fill="#fdf2f2" stroke="#c0392b" stroke-dasharray="3 2"/>
  <text x="510" y="244" text-anchor="middle" font-size="10" fill="#8a2a20">Security group — SSH 22, HTTP 80</text>

  <!-- EC2 -->
  <rect x="435" y="255" width="150" height="70" rx="5" fill="#fff4e5" stroke="#b5760a"/>
  <text x="510" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#7a4f06">EC2 (Ubuntu)</text>
  <text x="510" y="291" text-anchor="middle" font-size="9.5" fill="#7a4f06">nginx via Ansible</text>
  <text x="510" y="305" text-anchor="middle" font-size="9.5" fill="#7a4f06">IAM role (SSM), IMDSv2</text>
  <text x="510" y="319" text-anchor="middle" font-size="9.5" fill="#7a4f06">EBS encrypted</text>

  <!-- Arrow AWS logs to SIEM -->
  <line x1="510" y1="385" x2="510" y2="425" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="410" text-anchor="middle" font-size="10" fill="#57606a">auth logs</text>

  <!-- SIEM -->
  <rect x="345" y="430" width="330" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2b4a">SIEM — Elastic (Docker)</text>

  <rect x="365" y="466" width="140" height="40" rx="5" fill="#e7effc" stroke="#2c5aa0"/>
  <text x="435" y="483" text-anchor="middle" font-size="11" fill="#1a2b4a">Elasticsearch</text>
  <text x="435" y="497" text-anchor="middle" font-size="9" fill="#3a5a85">store + search logs</text>

  <rect x="515" y="466" width="140" height="40" rx="5" fill="#efe7fc" stroke="#6b3fa0"/>
  <text x="585" y="483" text-anchor="middle" font-size="11" fill="#3a1f6b">Kibana</text>
  <text x="585" y="497" text-anchor="middle" font-size="9" fill="#5a3a8a">detection engine</text>

  <rect x="365" y="516" width="290" height="48" rx="5" fill="#fdf2f2" stroke="#c0392b"/>
  <text x="510" y="534" text-anchor="middle" font-size="11" font-weight="600" fill="#8a2a20">Threshold rule — SSH brute force (ATT&amp;CK T1110)</text>
  <text x="510" y="550" text-anchor="middle" font-size="10" fill="#8a2a20">src_ip failures ≥ 5  →  alert fired</text>

  <!-- Detection rules box (right side) -->
  <rect x="700" y="135" width="170" height="150" rx="8" fill="#fbfbfc" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="785" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2b4a">Detection (Sigma)</text>
  <text x="785" y="180" text-anchor="middle" font-size="10" fill="#57606a">vendor-neutral rules</text>
  <text x="785" y="198" text-anchor="middle" font-size="10" fill="#57606a">mapped to MITRE ATT&amp;CK</text>
  <rect x="718" y="212" width="134" height="26" rx="4" fill="#fdf2f2" stroke="#c0392b"/>
  <text x="785" y="229" text-anchor="middle" font-size="9.5" fill="#8a2a20">T1110 brute force</text>
  <rect x="718" y="244" width="134" height="26" rx="4" fill="#fdf2f2" stroke="#c0392b"/>
  <text x="785" y="261" text-anchor="middle" font-size="9.5" fill="#8a2a20">T1059 download+exec</text>

  <!-- arrow sigma to siem -->
  <line x1="785" y1="285" x2="785" y2="505" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="785" y="400" text-anchor="middle" font-size="9" fill="#57606a" transform="rotate(90 785 400)">deployed to SIEM</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
